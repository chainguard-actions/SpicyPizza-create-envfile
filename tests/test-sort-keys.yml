name: Test sort_keys behavior
on:
  workflow_dispatch:
jobs:
  test-sort-keys-true:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          envkey_ZEBRA: "last"
          envkey_APPLE: "first"
          envkey_MANGO: "middle"
          sort_keys: "true"
      - name: Assert .env file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/.env" ]; then
            echo "FAIL: .env file was not created"
            exit 1
          fi
          echo "PASS: .env file exists"
      - name: Assert keys are sorted alphabetically
        run: |
          content=$(cat "$GITHUB_WORKSPACE/.env")
          echo "content:"
          echo "$content"

          # Extract just the key names in order
          keys=$(grep -oP '^[A-Z_]+(?==)' "$GITHUB_WORKSPACE/.env" | tr '\n' ' ')
          echo "keys in order: $keys"

          # Find positions of each key
          apple_line=$(grep -n "^APPLE=" "$GITHUB_WORKSPACE/.env" | cut -d: -f1)
          mango_line=$(grep -n "^MANGO=" "$GITHUB_WORKSPACE/.env" | cut -d: -f1)
          zebra_line=$(grep -n "^ZEBRA=" "$GITHUB_WORKSPACE/.env" | cut -d: -f1)

          echo "APPLE at line: $apple_line"
          echo "MANGO at line: $mango_line"
          echo "ZEBRA at line: $zebra_line"

          if [ -z "$apple_line" ] || [ -z "$mango_line" ] || [ -z "$zebra_line" ]; then
            echo "FAIL: one or more expected keys not found in .env"
            exit 1
          fi

          if [ "$apple_line" -lt "$mango_line" ] && [ "$mango_line" -lt "$zebra_line" ]; then
            echo "PASS: keys are sorted alphabetically (APPLE < MANGO < ZEBRA)"
          else
            echo "FAIL: keys are not sorted alphabetically"
            exit 1
          fi

  test-sort-keys-false:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          envkey_KEY_ONE: "value1"
          envkey_KEY_TWO: "value2"
          sort_keys: "false"
      - name: Assert .env file was created without sort_keys
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/.env" ]; then
            echo "FAIL: .env file was not created"
            exit 1
          fi
          content=$(cat "$GITHUB_WORKSPACE/.env")
          echo "content: $content"

          if ! grep -q "^KEY_ONE=value1$" "$GITHUB_WORKSPACE/.env"; then
            echo "FAIL: KEY_ONE=value1 not found"
            exit 1
          fi
          if ! grep -q "^KEY_TWO=value2$" "$GITHUB_WORKSPACE/.env"; then
            echo "FAIL: KEY_TWO=value2 not found"
            exit 1
          fi
          echo "PASS: all keys present in .env"
