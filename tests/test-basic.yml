name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          envkey_DEBUG: "false"
          envkey_SOME_API_KEY: "123456abcdef"
          envkey_APP_NAME: "myapp"
      - name: Assert .env file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/.env" ]; then
            echo "FAIL: .env file was not created"
            exit 1
          fi
          echo "PASS: .env file exists"
      - name: Assert .env file contains expected keys
        run: |
          content=$(cat "$GITHUB_WORKSPACE/.env")
          echo "content: $content"

          if ! grep -q "^DEBUG=false$" "$GITHUB_WORKSPACE/.env"; then
            echo "FAIL: DEBUG=false not found in .env"
            exit 1
          fi
          echo "PASS: DEBUG=false found"

          if ! grep -q "^SOME_API_KEY=123456abcdef$" "$GITHUB_WORKSPACE/.env"; then
            echo "FAIL: SOME_API_KEY=123456abcdef not found in .env"
            exit 1
          fi
          echo "PASS: SOME_API_KEY=123456abcdef found"

          if ! grep -q "^APP_NAME=myapp$" "$GITHUB_WORKSPACE/.env"; then
            echo "FAIL: APP_NAME=myapp not found in .env"
            exit 1
          fi
          echo "PASS: APP_NAME=myapp found"
