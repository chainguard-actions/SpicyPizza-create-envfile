name: Test fail_on_empty behavior
on:
  workflow_dispatch:
jobs:
  test-fail-on-empty-true:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with empty key and fail_on_empty=true
        id: action
        uses: .
        continue-on-error: true
        with:
          envkey_REQUIRED_KEY: ""
          fail_on_empty: "true"
      - name: Assert action failed due to empty key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when fail_on_empty=true and key is empty, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on empty key"

  test-fail-on-empty-false:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with empty key and fail_on_empty=false (default)
        id: action
        uses: .
        with:
          envkey_OPTIONAL_KEY: ""
          envkey_PRESENT_KEY: "hello"
          fail_on_empty: "false"
      - name: Assert action succeeded with empty key when fail_on_empty=false
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed when fail_on_empty=false, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action succeeded with empty key when fail_on_empty=false"
      - name: Assert .env file was created with empty key included
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/.env" ]; then
            echo "FAIL: .env file was not created"
            exit 1
          fi
          content=$(cat "$GITHUB_WORKSPACE/.env")
          echo "content: $content"

          if ! grep -q "^PRESENT_KEY=hello$" "$GITHUB_WORKSPACE/.env"; then
            echo "FAIL: PRESENT_KEY=hello not found in .env"
            exit 1
          fi
          echo "PASS: PRESENT_KEY=hello found"
