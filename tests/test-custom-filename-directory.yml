name: Test custom filename and directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create target directory
        run: mkdir -p "$GITHUB_WORKSPACE/config"
      - id: action
        uses: .
        with:
          envkey_DATABASE_URL: "postgres://localhost/mydb"
          envkey_PORT: "8080"
          file_name: "app.env"
          directory: "config"
      - name: Assert custom env file was created
        run: |
          TARGET="$GITHUB_WORKSPACE/config/app.env"
          if [ ! -f "$TARGET" ]; then
            echo "FAIL: $TARGET was not created"
            exit 1
          fi
          echo "PASS: $TARGET exists"
      - name: Assert custom env file contains expected keys
        run: |
          TARGET="$GITHUB_WORKSPACE/config/app.env"
          content=$(cat "$TARGET")
          echo "content: $content"

          if ! grep -q "^DATABASE_URL=postgres://localhost/mydb$" "$TARGET"; then
            echo "FAIL: DATABASE_URL not found in $TARGET"
            exit 1
          fi
          echo "PASS: DATABASE_URL found"

          if ! grep -q "^PORT=8080$" "$TARGET"; then
            echo "FAIL: PORT=8080 not found in $TARGET"
            exit 1
          fi
          echo "PASS: PORT=8080 found"
      - name: Assert default .env was NOT created in workspace root
        run: |
          if [ -f "$GITHUB_WORKSPACE/.env" ]; then
            echo "FAIL: unexpected .env file found in workspace root"
            exit 1
          fi
          echo "PASS: no .env in workspace root"
